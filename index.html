<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JASMINE OF THE ROSE®</title>

  <!-- LINK TO YOUR CSS DESIGN FILE -->
  <link rel="stylesheet" href="style.css">

  <!-- LINK TO YOUR JAVASCRIPT LOGIC FILE -->
  <script src="script.js" defer></script>
</head>


<body>
<!--Startup Sequence - Glitching-->
<div class="glitch-container">
    <div id="headerText" class="glitch header-text" data-text="JASMINE OF THE ROSE®">JASMINE OF THE ROSE®</div>
    <div id="subtitleText" class="glitch subtitle-text" data-text="Welcome to Jasmine Rose’s Portfolio Website&#10;Version 2.13">Welcome to Jasmine Rose’s Portfolio Website<br>Version 2.13</div>
</div>

<div id="loadingText" class="loading-text">Loading...</div>

<footer id="siteFooter" class="footer">
  Copyright (c) funtoo2, 1995. All Rights Reserved.
</footer>

<!-- Login Screen -->
<div id="passwordScreen" class="password-screen">
  <div class="login-box">
    <div class="login-title">Log On to Diana OS</div>
    <div class="login-content">
  <label class="login-label">
    Username
  </label>

  <input
    type="text"
    class="username-input"
    name="username"
    value="whatifmarirose">

  <label class="login-label">
    Password
  </label>

  <input
    type="password"
    class="password-input"
    name="password"
    placeholder="Password">

  <button class="login-button">
    ENTER
  </button>
    </div>
  </div>

  <!--Hint Popup 1-->
<div id="hintPopup" class="hint-popup">
  <div class="hint-popup-title">
    <span>Password Hint</span>
    <button id="hintCloseButton" class="hint-close-button">×</button>
  </div>

  <div class="hint-popup-body">
    <p>Do you want a hint?</p>

    <div class="hint-popup-buttons">
      <button id="hintYesButton" class="win-button">Yes</button>
      <button id="hintNoButton" class="win-button">No</button>
    </div>
  </div>
</div>

<!--Hint Popup 2-->
<div id="surePopup" class="hint-popup">
  <div class="hint-popup-title">
    <span>Confirmation</span>
    <button id="sureCloseButton" class="hint-close-button">×</button>
  </div>

  <div class="hint-popup-body">
    <p>Are You Sure?</p>

    <div class="hint-popup-buttons">
      <button id="sureYesButton" class="win-button">Yes</button>
      <button id="sureNoButton" class="win-button">No</button>
    </div>
  </div>
</div>

</div>



<!--We've now finally logged into our fake computer -

  <div class="desktop-icon">
    <img src="icon-work.png" alt="">
    <span>Portfolio</span>

  <div class="desktop-icon">
    <img src="icon-contact.png" alt="">
    <span>Contact</span>
  </div>

</div>
