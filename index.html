<style>
@import url('https://fonts.googleapis.com/css2?family=DotGothic16&family=Silkscreen:wght@400;700&display=swap');

body {
  margin: 0;
  min-height: 100vh;
  background: #7C44FF;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
}

.glitch-container {
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  width: 100%;
  text-align: center;
  padding: 20px;
}

.glitch {
  font-family: 'DotGothic16', 'Silkscreen', monospace;
  color: #ffffff;
  position: relative;
  display: inline-block;
  line-height: 1.3;
  white-space: pre-line;
}

.header-text {
  font-size: 70px;
  margin-bottom: 40px;
  opacity: 0;
  animation: initialEntrance 1.5s cubic-bezier(0.25, 1, 0.5, 1) forwards;
}

.subtitle-text {
  font-size: 23px;
  opacity: 0;
  animation: initialEntrance 1.5s cubic-bezier(0.25, 1, 0.5, 1) 0.5s forwards;
}

.login-title {
  font-family: 'DotGothic16', 'Silkscreen', monospace;
  font-size: 26px;
  color: #ffffff;
  text-align: center;
  margin-bottom: 22px;
}

.hint-popup {
  position: fixed;
  top: 42%;
  left: 56%;
  transform: translate(-50%, -50%);
  width: 260px;
  background: #c0c0c0;
  border: 2px outset #ffffff;
  box-shadow: 4px 4px 0 rgba(0,0,0,0.35);
  font-family: "MS Sans Serif", Arial, sans-serif;
  color: #000;
  opacity: 0;
  pointer-events: none;
  z-index: 30;
}

.hint-popup.active {
  opacity: 1;
  pointer-events: auto;
}

.hint-popup-title {
    cursor: move;
  user-select: none;
  background: linear-gradient(90deg, #000080, #1084d0);
  color: #fff;
  font-size: 13px;
  font-weight: bold;
  padding: 3px 4px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.hint-close-button {
  width: 18px;
  height: 18px;
  border: 2px outset #ffffff;
  background: #c0c0c0;
  color: #000;
  font-size: 12px;
  line-height: 12px;
  padding: 0;
  cursor: pointer;
}

.hint-popup-body {
  padding: 18px;
  font-size: 13px;
  text-align: center;
}

.hint-popup-buttons {
  margin-top: 16px;
  display: flex;
  justify-content: center;
  gap: 10px;
}

.win-button {
  min-width: 64px;
  padding: 4px 12px;
  border: 2px outset #ffffff;
  background: #c0c0c0;
  color: #000;
  font-family: "MS Sans Serif", Arial, sans-serif;
  font-size: 12px;
  cursor: pointer;
}

.win-button:active,
.hint-close-button:active {
  border: 2px inset #ffffff;
}

@keyframes initialEntrance {
  0% {
    opacity: 0;
    transform: scale(0.80);
  }

  100% {
    opacity: 1;
    transform: scale(1);
  }
}

.glitch::before,
.glitch::after {
  content: attr(data-text);
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  white-space: pre-line;
  overflow: hidden;
  opacity: 0;
  pointer-events: none;
}

.glitch::before {
  text-shadow: -1px 0 #ff00c1;
  transform: translateX(-1px);
}

.glitch::after {
  text-shadow: 1px 0 #00fff0;
  transform: translateX(1px);
}

.glitching::before,
.glitching::after {
  opacity: 1;
}

.glitching::before {
  animation: glitch-anim-1 1.5s linear infinite;
}

.glitching::after {
  animation: glitch-anim-2 1.5s linear infinite;
}

@keyframes glitch-anim-1 {
  0%,100% { clip: rect(0,0,0,0); transform: translateX(-1px) skew(0deg); }
  20% { clip: rect(5px,9999px,40px,0); transform: translateX(-2px) skew(3deg); }
  40% { clip: rect(40px,9999px,120px,0); transform: translateX(-1px) skew(-2deg); }
  60% { clip: rect(10px,9999px,85px,0); transform: translateX(-2px) skew(4deg); }
  80% { clip: rect(70px,9999px,150px,0); transform: translateX(-1px) skew(-3deg); }
}

@keyframes glitch-anim-2 {
  0%,100% { clip: rect(0,0,0,0); transform: translateX(1px) skew(0deg); }
  25% { clip: rect(30px,9999px,90px,0); transform: translateX(2px) skew(-4deg); }
  50% { clip: rect(5px,9999px,60px,0); transform: translateX(1px) skew(4deg); }
  75% { clip: rect(80px,9999px,160px,0); transform: translateX(2px) skew(-5deg); }
}

.loading-text {
  position: fixed;
  top: 75vh;
  left: 50vw;
  font-family: 'DotGothic16', 'Silkscreen', monospace;
  font-size: 18px;
  color: rgba(255,255,255,0.45);
  pointer-events: none;
  opacity: 0;
  transition:

}

.footer {

  font-family: 'DotGothic16', 'Silkscreen', monospace;

  opacity: 0;
  animation: footerFadeIn 4s ease 2s forwards;
  transition: opacity 0.8s ease;
}

.footer.hidden {
  opacity: 0 !important;
}

@keyframes footerFadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

/* password screen */
.password-screen {

.password-screen.active {

}

.login-box {

  backdrop-filter: blur(6px);
  font-family: 'DotGothic16', 'Silkscreen', monospace;
  color: #ffffff;
  text-align: center;
}

.login-content {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.login-label {
  font-size: 14px;
  color: rgba(255,255,255,0.85);
  text-align: left;
  margin-bottom: -2px;
}

.login-title {
  font-size: 30px;

}

.login-subtitle {
  font-size: 16px;
  margin-bottom: 18px;
}

.username-input,
.password-input {
  width: 100%;
  box-sizing: border-box;

  padding: 12px;

.username-input:focus,

.login-button {

.login-button:hover {

}

<script>
const headerNode = document.getElementById("rm-header");
const subtitleNode = document.getElementById("rm-subtitle");
const loadingText = document.getElementById("loadingText");
const siteFooter = document.getElementById("siteFooter");
const passwordScreen = document.getElementById("passwordScreen");

const header1_Text = "JASMINE OF THE ROSE®";
const header2_Text = "薔薇の茉莉®";

const sub1_HTML = "Welcome to Jasmine Rose’s Portfolio Website<br>Version 1.01";
const sub1_Shadow = "Welcome to Jasmine Rose’s Portfolio Website\nVersion 1.01";

const sub2_HTML = "茉莉ローズのポートフォリオ･サイトにようこそ〜<br>ver.1.01";
const sub2_Shadow = "茉莉ローズのポートフォリオ･サイトにようこそ〜\nver.1.01";

let isFirstState = true;

function runGlobalGlitch() {
  headerNode.classList.add("glitching");
  subtitleNode.classList.add("glitching");

  setTimeout(() => {
    if (isFirstState) {
      headerNode.innerText = header2_Text;
      headerNode.setAttribute("data-text", header2_Text);

      subtitleNode.innerHTML = sub2_HTML;
      subtitleNode.setAttribute("data-text", sub2_Shadow);
    } else {
      headerNode.innerText = header1_Text;
      headerNode.setAttribute("data-text", header1_Text);

      subtitleNode.innerHTML = sub1_HTML;
      subtitleNode.setAttribute("data-text", sub1_Shadow);
    }

    isFirstState = !isFirstState;
  }, 800);

  setTimeout(() => {
    headerNode.classList.remove("glitching");
    subtitleNode.classList.remove("glitching");
  }, 1500);
}

setTimeout(() => {
  runGlobalGlitch();
  setInterval(runGlobalGlitch, 5500);
}, 3850);

function moveLoadingText() {
  const x = Math.random() * 80 + 5;
  const y = Math.random() * 75 + 5;

  loadingText.style.left = x + "vw";
  loadingText.style.top = y + "vh";
}

let dots = 3;

function animateLoadingDots() {
  dots = (dots + 1) % 4;
  loadingText.textContent = "Loading" + ".".repeat(dots);
}

setTimeout(() => {
  loadingText.style.opacity = "1";
  moveLoadingText();

  setInterval(moveLoadingText, 12000);
  setInterval(animateLoadingDots, 500);
}, 1800);

let loginScreenShown = false;
let interactionDetected = false;

function showPasswordScreen() {
  if (loginScreenShown) return;

  loginScreenShown = true;

  loadingText.style.opacity = "0";
  siteFooter.classList.add("hidden");
  passwordScreen.classList.add("active");

  setTimeout(() => {
  openHintPopup();
}, 6000);
}

const defaultLoginTimer = setTimeout(showPasswordScreen, 13000);

function triggerEarlyLoginScreen() {
  if (interactionDetected || loginScreenShown) return;

  interactionDetected = true;
  clearTimeout(defaultLoginTimer);

  setTimeout(showPasswordScreen, 6000);
}

const hintPopup = document.getElementById("hintPopup");
const hintYesButton = document.getElementById("hintYesButton");
const hintNoButton = document.getElementById("hintNoButton");
const hintCloseButton = document.getElementById("hintCloseButton");

const surePopup = document.getElementById("surePopup");

const sureYesButton = document.getElementById("sureYesButton");
const sureNoButton = document.getElementById("sureNoButton");
const sureCloseButton = document.getElementById("sureCloseButton");

function openHintPopup() {
  hintPopup.classList.add("active");
}

function closeHintPopup() {
  hintPopup.classList.remove("active");
}

hintYesButton.addEventListener("click", () => {
  closeHintPopup();
  alert("Password Hint:\n\nType anything, Diva");
});

hintNoButton.addEventListener("click", () => {
  closeHintPopup();
  setTimeout(openSurePopup, 4000);
});

hintCloseButton.addEventListener("click", () => {
  closeHintPopup();
  setTimeout(openSurePopup, 4000);
});

sureYesButton.addEventListener("click", closeSurePopup);

sureNoButton.addEventListener("click", () => {
  closeSurePopup();

  hintPopup.style.transform = "translate(-50%, -50%)";
  hintPopup.style.left = "62%";
  hintPopup.style.top = "58%";

  setTimeout(openHintPopup, 250);
});
sureCloseButton.addEventListener("click", closeSurePopup);

makeDraggable(hintPopup);
makeDraggable(surePopup);

function makeDraggable(popup) {

  const titleBar = popup.querySelector(".hint-popup-title");

  let dragging = false;
  let offsetX = 0;
  let offsetY = 0;

  titleBar.addEventListener("mousedown", (e) => {

    dragging = true;

    const rect = popup.getBoundingClientRect();

    offsetX = e.clientX - rect.left;
    offsetY = e.clientY - rect.top;

    popup.style.transform = "none";
    popup.style.left = rect.left + "px";
    popup.style.top = rect.top + "px";
  });

  window.addEventListener("mousemove", (e) => {

    if (!dragging) return;

    popup.style.left = (e.clientX - offsetX) + "px";
    popup.style.top = (e.clientY - offsetY) + "px";
  });

  window.addEventListener("mouseup", () => {
    dragging = false;
  });
}

function openSurePopup() {
  surePopup.classList.add("active");
}

function closeSurePopup() {
  surePopup.classList.remove("active");
}

window.addEventListener("mousemove", triggerEarlyLoginScreen);
window.addEventListener("click", triggerEarlyLoginScreen);
window.addEventListener("touchstart", triggerEarlyLoginScreen);
</script>
